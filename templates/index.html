<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>EFT Flea v{{ version }}</title>
<style>
  :root {
    --bg: #F0F2F7;
    --card: #FFFFFF;
    --border: rgba(0,0,0,0.08);
    --text: #111827;
    --muted: #4B5563;
    --accent: #5B52E8;
    --profit: #059669;
    --row-hover: rgba(91,82,232,0.08);
    --copy-highlight: rgba(91,82,232,0.16);
    --update-bg: rgba(91,82,232,0.10);
    --update-text: #5B52E8;
    --error-bg: #fef2f2;
    --error-text: #DC2626;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0F1117;
      --card: #1A1D27;
      --border: rgba(255,255,255,0.07);
      --text: #E2E8F0;
      --muted: #8892A4;
      --accent: #6C63FF;
      --profit: #10B981;
      --row-hover: rgba(108,99,255,0.10);
      --copy-highlight: rgba(108,99,255,0.22);
      --update-bg: rgba(108,99,255,0.12);
      --update-text: #A78BFA;
      --error-bg: rgba(239,68,68,0.12);
      --error-text: #F87171;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 14px;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--card);
  }
  .title-group {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .app-name-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .app-name {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
  }
  .app-version {
    font-weight: 500;
    color: var(--accent);
  }
  .mode-tabs {
    display: flex;
    gap: 4px;
  }
  .mode-tab-btn {
    padding: 4px 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--muted);
    border-radius: 5px;
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
  }
  .mode-tab-btn.active {
    background: var(--card);
    color: var(--accent);
    border-color: var(--accent);
  }
  .controls {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  #search {
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    width: 200px;
  }
  .min-profit-label {
    color: var(--muted);
    font-size: 13px;
  }
  #min-profit {
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    width: 90px;
    -moz-appearance: textfield;
    appearance: textfield;
  }
  #min-profit::-webkit-outer-spin-button,
  #min-profit::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  #refresh {
    padding: 6px 14px;
    border: none;
    border-radius: 6px;
    background: var(--accent);
    color: white;
    font-size: 13px;
    cursor: pointer;
  }
  #refresh:disabled {
    opacity: 0.6;
    cursor: default;
  }
  .tab-bar {
    display: flex;
    gap: 6px;
    padding: 10px 20px 0;
  }
  .tab-btn {
    padding: 7px 16px;
    border: 1px solid var(--border);
    border-bottom: none;
    background: var(--bg);
    color: var(--muted);
    border-radius: 6px 6px 0 0;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
  }
  .tab-btn.active {
    background: var(--card);
    color: var(--accent);
  }
  .trader-levels {
    display: none;
    flex-direction: column;
    gap: 8px;
    padding: 10px 20px;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    font-size: 12px;
  }
  .trader-levels-label {
    color: var(--muted);
    font-weight: 500;
  }
  .trader-levels-grid {
    display: grid;
    grid-template-columns: repeat(4, auto);
    justify-content: start;
    gap: 8px 20px;
  }
  .trader-level-group {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .trader-level-group .trader-name {
    color: var(--text);
    white-space: nowrap;
    width: 80px;
    flex-shrink: 0;
  }
  .level-btns {
    display: flex;
    gap: 2px;
  }
  .level-btn {
    width: 18px;
    height: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--muted);
    border-radius: 3px;
    font-size: 10px;
    line-height: 1;
    cursor: pointer;
  }
  .level-btn.active {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }
  #status {
    color: var(--muted);
    font-size: 12px;
    padding: 6px 20px;
  }
  #error {
    display: none;
    margin: 12px 20px;
    padding: 10px 14px;
    border-radius: 6px;
    background: var(--error-bg);
    color: var(--error-text);
    font-size: 13px;
  }
  #update-banner {
    display: none;
    align-items: center;
    justify-content: space-between;
    margin: 12px 20px 0;
    padding: 10px 14px;
    border-radius: 6px;
    background: var(--update-bg);
    color: var(--update-text);
    font-size: 13px;
  }
  #update-banner button {
    padding: 5px 12px;
    border: none;
    border-radius: 6px;
    background: var(--accent);
    color: white;
    font-size: 12px;
    cursor: pointer;
    margin-left: 10px;
  }
  main {
    padding: 12px 20px 24px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  th, td {
    padding: 8px 12px;
    text-align: left;
    border-bottom: 1px solid var(--border);
  }
  th {
    color: var(--muted);
    font-weight: 600;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  th:hover { color: var(--accent); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  th.group-header {
    text-align: center;
    cursor: default;
  }
  th.group-header:hover { color: var(--muted); }
  .copy-btn {
    border: none;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 13px;
    padding: 2px 6px;
    margin-right: 8px;
    border-radius: 4px;
    line-height: 1;
  }
  .copy-btn:hover { background: var(--row-hover); color: var(--accent); }
  .copy-btn.copied { color: var(--profit); }
  .lock-icon {
    margin-left: 6px;
    font-size: 11px;
    opacity: 0.7;
  }
  tbody tr:hover { background: var(--row-hover); }
  tbody tr:last-child td { border-bottom: none; }
  td.profit { color: var(--profit); font-weight: 600; }
  .empty {
    text-align: center;
    color: var(--muted);
    padding: 30px;
  }
</style>
</head>
<body>

<header>
  <div class="title-group">
    <div class="app-name-row">
      <div class="app-name">EFT Flea <span class="app-version">v{{ version }}</span></div>
      <div class="mode-tabs">
        <button class="mode-tab-btn active" data-mode="pve" onclick="setGameMode('pve')">PvE</button>
        <button class="mode-tab-btn" data-mode="regular" onclick="setGameMode('regular')">Regular</button>
        <button class="mode-tab-btn" data-mode="pvp-season" onclick="setGameMode('pvp-season')">PvP Season</button>
      </div>
    </div>
  </div>
  <div class="controls">
    <input id="search" type="text" placeholder="Filter items..." oninput="renderRows()">
    <label class="min-profit-label" for="min-profit">Min Profit</label>
    <input id="min-profit" type="number" min="0" step="100" value="2000" oninput="renderRows(); saveSettings()">
    <button id="refresh" onclick="refresh()">Refresh</button>
  </div>
</header>

<div class="tab-bar">
  <button class="tab-btn active" id="tab-btn-flea" onclick="switchTab('flea')">Flea &rarr; Trader</button>
  <button class="tab-btn" id="tab-btn-trader" onclick="switchTab('trader')">Trader &rarr; Flea</button>
</div>

<div class="trader-levels" id="trader-levels-bar" style="display:none">
  <div class="trader-levels-label">Your trader levels:</div>
  <div class="trader-levels-grid">
    <div class="trader-level-group" data-trader="Prapor">
      <span class="trader-name">Prapor</span>
      <div class="level-btns">
        <button class="level-btn" data-level="1" onclick="setTraderLevel('Prapor', 1)">1</button>
        <button class="level-btn" data-level="2" onclick="setTraderLevel('Prapor', 2)">2</button>
        <button class="level-btn" data-level="3" onclick="setTraderLevel('Prapor', 3)">3</button>
        <button class="level-btn active" data-level="4" onclick="setTraderLevel('Prapor', 4)">4</button>
      </div>
    </div>
    <div class="trader-level-group" data-trader="Therapist">
      <span class="trader-name">Therapist</span>
      <div class="level-btns">
        <button class="level-btn" data-level="1" onclick="setTraderLevel('Therapist', 1)">1</button>
        <button class="level-btn" data-level="2" onclick="setTraderLevel('Therapist', 2)">2</button>
        <button class="level-btn" data-level="3" onclick="setTraderLevel('Therapist', 3)">3</button>
        <button class="level-btn active" data-level="4" onclick="setTraderLevel('Therapist', 4)">4</button>
      </div>
    </div>
    <div class="trader-level-group" data-trader="Skier">
      <span class="trader-name">Skier</span>
      <div class="level-btns">
        <button class="level-btn" data-level="1" onclick="setTraderLevel('Skier', 1)">1</button>
        <button class="level-btn" data-level="2" onclick="setTraderLevel('Skier', 2)">2</button>
        <button class="level-btn" data-level="3" onclick="setTraderLevel('Skier', 3)">3</button>
        <button class="level-btn active" data-level="4" onclick="setTraderLevel('Skier', 4)">4</button>
      </div>
    </div>
    <div class="trader-level-group" data-trader="Peacekeeper">
      <span class="trader-name">Peacekeeper</span>
      <div class="level-btns">
        <button class="level-btn" data-level="1" onclick="setTraderLevel('Peacekeeper', 1)">1</button>
        <button class="level-btn" data-level="2" onclick="setTraderLevel('Peacekeeper', 2)">2</button>
        <button class="level-btn" data-level="3" onclick="setTraderLevel('Peacekeeper', 3)">3</button>
        <button class="level-btn active" data-level="4" onclick="setTraderLevel('Peacekeeper', 4)">4</button>
      </div>
    </div>
    <div class="trader-level-group" data-trader="Mechanic">
      <span class="trader-name">Mechanic</span>
      <div class="level-btns">
        <button class="level-btn" data-level="1" onclick="setTraderLevel('Mechanic', 1)">1</button>
        <button class="level-btn" data-level="2" onclick="setTraderLevel('Mechanic', 2)">2</button>
        <button class="level-btn" data-level="3" onclick="setTraderLevel('Mechanic', 3)">3</button>
        <button class="level-btn active" data-level="4" onclick="setTraderLevel('Mechanic', 4)">4</button>
      </div>
    </div>
    <div class="trader-level-group" data-trader="Ragman">
      <span class="trader-name">Ragman</span>
      <div class="level-btns">
        <button class="level-btn" data-level="1" onclick="setTraderLevel('Ragman', 1)">1</button>
        <button class="level-btn" data-level="2" onclick="setTraderLevel('Ragman', 2)">2</button>
        <button class="level-btn" data-level="3" onclick="setTraderLevel('Ragman', 3)">3</button>
        <button class="level-btn active" data-level="4" onclick="setTraderLevel('Ragman', 4)">4</button>
      </div>
    </div>
    <div class="trader-level-group" data-trader="Jaeger">
      <span class="trader-name">Jaeger</span>
      <div class="level-btns">
        <button class="level-btn" data-level="1" onclick="setTraderLevel('Jaeger', 1)">1</button>
        <button class="level-btn" data-level="2" onclick="setTraderLevel('Jaeger', 2)">2</button>
        <button class="level-btn" data-level="3" onclick="setTraderLevel('Jaeger', 3)">3</button>
        <button class="level-btn active" data-level="4" onclick="setTraderLevel('Jaeger', 4)">4</button>
      </div>
    </div>
    <div class="trader-level-group" data-trader="Ref">
      <span class="trader-name">Ref</span>
      <div class="level-btns">
        <button class="level-btn" data-level="1" onclick="setTraderLevel('Ref', 1)">1</button>
        <button class="level-btn" data-level="2" onclick="setTraderLevel('Ref', 2)">2</button>
        <button class="level-btn" data-level="3" onclick="setTraderLevel('Ref', 3)">3</button>
        <button class="level-btn active" data-level="4" onclick="setTraderLevel('Ref', 4)">4</button>
      </div>
    </div>
  </div>
</div>

<div id="update-banner">
  <span id="update-text"></span>
  <span>
    <button id="update-btn" onclick="applyUpdate()">Update Now</button>
  </span>
</div>

<div id="status">Loading&hellip;</div>
<div id="error"></div>

<main>
  <table id="table-flea">
    <thead>
      <tr>
        <th rowspan="2" onclick="sortBy('name')">Item</th>
        <th class="num" rowspan="2" onclick="sortBy('flea')">Flea Price</th>
        <th class="num group-header" colspan="3">Buy Until</th>
        <th class="num" rowspan="2" onclick="sortBy('profit')">Profit</th>
      </tr>
      <tr>
        <th class="num" onclick="sortBy('rub')">RUB</th>
        <th class="num" onclick="sortBy('usd')">USD</th>
        <th class="num" onclick="sortBy('eur')">EUR</th>
      </tr>
    </thead>
    <tbody id="rows-flea"></tbody>
  </table>

  <table id="table-trader" style="display:none">
    <thead>
      <tr>
        <th onclick="sortBy('name')">Item</th>
        <th onclick="sortBy('trader')">Trader</th>
        <th class="num" onclick="sortBy('traderLevel')">Level</th>
        <th class="num" onclick="sortBy('buyPrice')">Buy Price</th>
        <th class="num" onclick="sortBy('fleaSell')">Flea Sell</th>
        <th class="num" onclick="sortBy('fee')">Flea Fee</th>
        <th class="num" onclick="sortBy('profit')">Profit</th>
        <th class="num" onclick="sortBy('buyLimit')">Buy Limit</th>
        <th class="num" onclick="sortBy('profitPerReset')">Profit/Reset</th>
      </tr>
    </thead>
    <tbody id="rows-trader"></tbody>
  </table>
</main>

<script>
let activeTab = 'flea';
let gameMode = 'pve';

let dataFlea = [];
let sortKeyFlea = 'profit';
let sortDirFlea = -1;
let copiedNamesFlea = new Set();

let dataTrader = [];
let sortKeyTrader = 'profit';
let sortDirTrader = -1;
let copiedNamesTrader = new Set();

let pendingUpdateUrl = null;

function fmt(n) {
  return n.toLocaleString();
}

function escapeHtml(str) {
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function switchTab(tab) {
  activeTab = tab;
  document.getElementById('tab-btn-flea').classList.toggle('active', tab === 'flea');
  document.getElementById('tab-btn-trader').classList.toggle('active', tab === 'trader');
  document.getElementById('table-flea').style.display = tab === 'flea' ? '' : 'none';
  document.getElementById('table-trader').style.display = tab === 'trader' ? '' : 'none';
  document.getElementById('trader-levels-bar').style.display = tab === 'trader' ? 'flex' : 'none';
  renderRows();
  saveSettings();
}

async function saveSettings() {
  try {
    await fetch('/api/settings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        minProfit: document.getElementById('min-profit').value,
        traderLevels: getTraderLevels(),
        activeTab: activeTab,
        gameMode: gameMode,
      }),
    });
  } catch (e) {
    // Non-critical - just means settings won't be remembered this time.
  }
}

async function loadSettings() {
  try {
    const response = await fetch('/api/settings');
    const settings = await response.json();

    if (settings.minProfit != null) {
      document.getElementById('min-profit').value = settings.minProfit;
    }
    if (settings.traderLevels) {
      document.querySelectorAll('.trader-level-group').forEach(group => {
        const saved = settings.traderLevels[group.dataset.trader];
        if (saved) applyTraderLevel(group, Number(saved));
      });
    }
    if (settings.gameMode) {
      applyGameMode(settings.gameMode);
    }
    if (settings.activeTab) {
      switchTab(settings.activeTab);
    }
  } catch (e) {
    // No saved settings yet, or failed to load - defaults are fine.
  }
}

function applyGameMode(mode) {
  gameMode = mode;
  document.querySelectorAll('.mode-tab-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.mode === mode);
  });
}

async function setGameMode(mode) {
  applyGameMode(mode);
  saveSettings();
  await refresh();
}

function getTraderLevels() {
  const levels = {};
  document.querySelectorAll('.trader-level-group').forEach(group => {
    const activeBtn = group.querySelector('.level-btn.active');
    levels[group.dataset.trader] = activeBtn ? Number(activeBtn.dataset.level) : 4;
  });
  return levels;
}

function applyTraderLevel(group, level) {
  group.querySelectorAll('.level-btn').forEach(btn => {
    btn.classList.toggle('active', Number(btn.dataset.level) === level);
  });
}

function setTraderLevel(trader, level) {
  const group = document.querySelector(`.trader-level-group[data-trader="${trader}"]`);
  applyTraderLevel(group, level);
  renderRows();
  saveSettings();
}

// dataTrader holds one entry per item: { name, fleaSell, fee, offers: [...] }.
// For the currently selected trader levels, pick whichever offer is both
// accessible and most profitable for that item.
function computeAccessibleTraderRows() {
  const levels = getTraderLevels();
  const rows = [];
  for (const item of dataTrader) {
    const accessible = item.offers.filter(o => o.traderLevel <= (levels[o.trader] ?? 4));
    if (accessible.length === 0) continue;

    let best = accessible[0];
    for (const offer of accessible) {
      if (offer.profit > best.profit) best = offer;
    }

    rows.push({
      name: item.name,
      fleaSell: item.fleaSell,
      fee: item.fee,
      trader: best.trader,
      traderLevel: best.traderLevel,
      buyPrice: best.buyPrice,
      profit: best.profit,
      buyLimit: best.buyLimit,
      profitPerReset: best.profitPerReset,
      taskLocked: best.taskLocked,
    });
  }
  return rows;
}

function sortBy(key) {
  if (activeTab === 'flea') {
    if (sortKeyFlea === key) {
      sortDirFlea *= -1;
    } else {
      sortKeyFlea = key;
      sortDirFlea = key === 'name' ? 1 : -1;
    }
  } else {
    if (sortKeyTrader === key) {
      sortDirTrader *= -1;
    } else {
      sortKeyTrader = key;
      sortDirTrader = (key === 'name' || key === 'trader') ? 1 : -1;
    }
  }
  renderRows();
}

function sortItems(items, sortKey, sortDir) {
  return items.slice().sort((a, b) => {
    let va = a[sortKey], vb = b[sortKey];
    if (va == null) va = -1;
    if (vb == null) vb = -1;
    if (typeof va === 'string') return va.localeCompare(vb) * sortDir;
    return (va - vb) * sortDir;
  });
}

function renderRows() {
  const filter = document.getElementById('search').value.toLowerCase();
  const minProfit = Number(document.getElementById('min-profit').value) || 0;

  if (activeTab === 'flea') {
    renderFleaRows(filter, minProfit);
  } else {
    renderTraderRows(filter, minProfit);
  }
}

function renderFleaRows(filter, minProfit) {
  const rowsEl = document.getElementById('rows-flea');
  let filtered = dataFlea.filter(item =>
    item.name.toLowerCase().includes(filter) && item.profit >= minProfit
  );
  filtered = sortItems(filtered, sortKeyFlea, sortDirFlea);

  if (filtered.length === 0) {
    rowsEl.innerHTML = '<tr><td colspan="6" class="empty">No items match.</td></tr>';
    return;
  }

  rowsEl.innerHTML = filtered.map(item => {
    const copied = copiedNamesFlea.has(item.name);
    return `
    <tr>
      <td><button class="copy-btn${copied ? ' copied' : ''}" data-name="${escapeHtml(item.name)}" title="Copy name to clipboard">${copied ? '✓' : '⧉'}</button>${escapeHtml(item.name)}</td>
      <td class="num">${fmt(item.flea)}</td>
      <td class="num">${fmt(item.rub)}</td>
      <td class="num">${fmt(item.usd)}</td>
      <td class="num">${fmt(item.eur)}</td>
      <td class="num profit">${fmt(item.profit)}</td>
    </tr>
  `;
  }).join('');
}

function renderTraderRows(filter, minProfit) {
  const rowsEl = document.getElementById('rows-trader');
  const accessibleRows = computeAccessibleTraderRows();
  let filtered = accessibleRows.filter(item =>
    item.name.toLowerCase().includes(filter) && item.profit >= minProfit
  );
  filtered = sortItems(filtered, sortKeyTrader, sortDirTrader);

  if (filtered.length === 0) {
    rowsEl.innerHTML = '<tr><td colspan="9" class="empty">No items match.</td></tr>';
    return;
  }

  rowsEl.innerHTML = filtered.map(item => {
    const copied = copiedNamesTrader.has(item.name);
    const lock = item.taskLocked ? '<span class="lock-icon" title="Requires a task to unlock this price">&#128274;</span>' : '';
    return `
    <tr>
      <td><button class="copy-btn${copied ? ' copied' : ''}" data-name="${escapeHtml(item.name)}" title="Copy name to clipboard">${copied ? '✓' : '⧉'}</button>${escapeHtml(item.name)}${lock}</td>
      <td>${escapeHtml(item.trader)}</td>
      <td class="num">LL${item.traderLevel}</td>
      <td class="num">${fmt(item.buyPrice)}</td>
      <td class="num">${fmt(item.fleaSell)}</td>
      <td class="num">${fmt(item.fee)}</td>
      <td class="num profit">${fmt(item.profit)}</td>
      <td class="num">${item.buyLimit || '&mdash;'}</td>
      <td class="num">${item.profitPerReset != null ? fmt(item.profitPerReset) : '&mdash;'}</td>
    </tr>
  `;
  }).join('');
}

async function copyToClipboard(text) {
  try {
    await navigator.clipboard.writeText(text);
  } catch (e) {
    const textarea = document.createElement('textarea');
    textarea.value = text;
    textarea.style.position = 'fixed';
    textarea.style.opacity = '0';
    document.body.appendChild(textarea);
    textarea.select();
    document.execCommand('copy');
    document.body.removeChild(textarea);
  }
}

let highlightedRow = null;
let highlightTimeout = null;
const HIGHLIGHT_DURATION_MS = 30000;

function highlightRow(row) {
  if (highlightedRow && highlightedRow !== row) {
    clearRowHighlight(highlightedRow);
  }
  clearTimeout(highlightTimeout);

  row.style.transition = 'none';
  row.style.backgroundColor = 'var(--copy-highlight)';
  void row.offsetWidth; // force reflow so the transition below re-applies
  row.style.transition = 'background-color 1.5s ease-out';

  highlightedRow = row;
  highlightTimeout = setTimeout(() => clearRowHighlight(row), HIGHLIGHT_DURATION_MS);
}

function clearRowHighlight(row) {
  row.style.backgroundColor = '';
  if (highlightedRow === row) {
    highlightedRow = null;
  }
}

document.addEventListener('click', async (e) => {
  const btn = e.target.closest('.copy-btn');
  if (!btn) return;
  // Always re-copy, even if already showing the checkmark - covers the
  // case where the first copy silently failed or got overwritten.
  await copyToClipboard(btn.dataset.name);
  const copiedSet = btn.closest('#rows-flea') ? copiedNamesFlea : copiedNamesTrader;
  copiedSet.add(btn.dataset.name);
  btn.textContent = '✓';
  btn.classList.add('copied');

  const row = btn.closest('tr');
  if (row) highlightRow(row);
});

function setStatus(text) {
  document.getElementById('status').textContent = text;
}

function showError(message) {
  const el = document.getElementById('error');
  el.textContent = message;
  el.style.display = message ? 'block' : 'none';
}

async function refresh() {
  const btn = document.getElementById('refresh');
  btn.disabled = true;
  setStatus('Refreshing…');
  showError('');
  try {
    const mode = gameMode;
    const [fleaResp, traderResp] = await Promise.all([
      fetch(`/api/items?mode=${mode}`),
      fetch(`/api/trader-to-flea?mode=${mode}`),
    ]);
    const fleaResult = await fleaResp.json();
    const traderResult = await traderResp.json();

    let errors = [];
    let updated = '';

    if (fleaResult.ok) {
      dataFlea = fleaResult.items;
      copiedNamesFlea.clear();
      updated = fleaResult.updated;
    } else {
      errors.push(fleaResult.error);
    }

    if (traderResult.ok) {
      dataTrader = traderResult.items;
      copiedNamesTrader.clear();
      updated = updated || traderResult.updated;
    } else {
      errors.push(traderResult.error);
    }

    renderRows();

    if (errors.length) {
      showError(errors.join(' | '));
    }
    const count = activeTab === 'flea' ? dataFlea.length : dataTrader.length;
    setStatus(`${count} items above profit threshold · updated ${updated}`);
  } catch (e) {
    showError(String(e));
    setStatus('Refresh failed.');
  } finally {
    btn.disabled = false;
  }
}

async function checkForUpdate() {
  try {
    const response = await fetch('/api/update-check');
    const result = await response.json();
    if (result.update) {
      pendingUpdateUrl = result.update.download_url;
      document.getElementById('update-text').textContent =
        `Update available: v${result.update.version} (you have v${result.current_version})`;
      document.getElementById('update-banner').style.display = 'flex';
    }
  } catch (e) {
    // Silently ignore - update checks should never interrupt normal use.
  }
}

function showUpdateInstalledMessage() {
  document.getElementById('update-text').textContent =
    'Update installed - please close and reopen the app.';
  document.getElementById('update-btn').style.display = 'none';
}

async function applyUpdate() {
  if (!pendingUpdateUrl) return;
  const btn = document.getElementById('update-btn');
  btn.disabled = true;
  btn.textContent = 'Updating…';
  try {
    const response = await fetch('/api/update-apply', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ download_url: pendingUpdateUrl }),
    });
    const result = await response.json();
    if (result.ok) {
      showUpdateInstalledMessage();
    } else {
      showError(result.error);
      btn.disabled = false;
      btn.textContent = 'Update Now';
    }
  } catch (e) {
    // The connection can drop if the process exits before the response
    // fully arrives - treat that as success too, since the app only ever
    // exits after the swap has already succeeded.
    showUpdateInstalledMessage();
  }
}

document.addEventListener('DOMContentLoaded', async () => {
  await loadSettings();
  refresh();
  checkForUpdate();
});
</script>
